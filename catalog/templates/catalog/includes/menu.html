<header class="bg-white border-bottom shadow-sm">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a
                class="navbar-brand fw-bold text-primary"
                href="{% url 'catalog:product_list' %}"
            >
                SkyStore
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainMenu"
                aria-controls="mainMenu"
                aria-expanded="false"
                aria-label="Открыть меню"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="mainMenu"
            >
                <!-- Основные кнопки слева -->
                <div class="navbar-nav me-auto d-flex gap-2">
                    <a
                        class="btn btn-outline-primary"
                        href="{% url 'catalog:product_list' %}"
                    >
                        Каталог
                    </a>

                    <a
                        class="btn btn-outline-primary"
                        href="{% url 'catalog:contacts' %}"
                    >
                        Контакты
                    </a>

                    <a
                        class="btn btn-outline-primary"
                        href="{% url 'blog:blog_list' %}"
                    >
                        Блог
                    </a>

                    {% if user.is_authenticated %}
                        <a
                            class="btn btn-primary"
                            href="{% url 'catalog:product_create' %}"
                        >
                            Добавить товар
                        </a>
                    {% endif %}
                </div>

                <!-- Авторизация справа -->
                <div
                    class="d-flex align-items-center gap-2
                           ms-lg-auto mt-3 mt-lg-0"
                >
                    {% if user.is_authenticated %}
                        <a
                            class="btn btn-outline-primary"
                            href="{% url 'users:profile' %}"
                        >
                            {{ user.email }}
                        </a>

                        <form
                            method="post"
                            action="{% url 'users:logout' %}"
                            class="m-0"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-outline-danger"
                            >
                                Выйти
                            </button>
                        </form>
                    {% else %}
                        <a
                            class="btn btn-outline-primary"
                            href="{% url 'users:login' %}"
                        >
                            Войти
                        </a>

                        <a
                            class="btn btn-primary"
                            href="{% url 'users:register' %}"
                        >
                            Регистрация
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
