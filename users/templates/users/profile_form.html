{% extends "catalog/base.html" %}

{% block title %}
    Профиль — SkyStore
{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h3 mb-4">Мой профиль</h1>

                    {% if user.avatar %}
                        <img
                            src="{{ user.avatar.url }}"
                            alt="{{ user.email }}"
                            class="rounded-circle mb-4"
                            style="
                                width: 150px;
                                height: 150px;
                                object-fit: cover;
                            "
                        >
                    {% endif %}

                    <form
                        method="post"
                        enctype="multipart/form-data"
                    >
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-3">
                                <label
                                    for="{{ field.id_for_label }}"
                                    class="form-label"
                                >
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% for error in field.errors %}
                                    <div class="text-danger small">
                                        {{ error }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Сохранить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
